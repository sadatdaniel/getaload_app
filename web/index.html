<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Your download server: downloads, files and media.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GetALoad">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>GetALoad</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:#f8fafc;color:#0f172a;font-family:system-ui,sans-serif}
    #splash .ring{width:40px;height:40px;border:4px solid #e0e7ff;border-top-color:#4f46e5;border-radius:50%;
      animation:spin .8s linear infinite}
    #splash .name{margin-top:16px;font-weight:600}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-color-scheme:dark){#splash{background:#020617;color:#f1f5f9}}
  </style>
</head>
<body>
  <!-- Plain HTML splash: shows before Flutter has loaded, removed on its first frame. -->
  <div id="splash"><div class="ring"></div><div class="name">GetALoad</div></div>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      var s = document.getElementById("splash");
      if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
